name: Docker Build

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref to build (branch, tag, or SHA)'
        required: false
        default: 'main'
      version_tag:
        description: 'Version tag for the images (e.g., v1.0.0)'
        required: false
  repository_dispatch:
    types: [build]
  # Weekly rebuild of the latest release so it picks up patched base images.
  schedule:
    - cron: "23 4 * * 1"

concurrency:
  group: "${{ github.workflow }}-${{ github.event_name == 'schedule' && 'scheduled' || github.event.inputs.ref || github.event.client_payload.ref || 'main' }}"
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  TRIVY_VERSION: v0.76.1
  TRIVY_FAIL_SEVERITY: CRITICAL

jobs:
  # Skip the build if all images already exist for this commit SHA.
  check:
    runs-on: ubuntu-latest
    outputs:
      exists: ${{ steps.check.outputs.exists }}
      short_sha: ${{ steps.target.outputs.short_sha }}
      ref: ${{ steps.target.outputs.ref }}
      version: ${{ steps.target.outputs.version }}
      tip: ${{ steps.target.outputs.tip }}
    steps:
      - name: Resolve build target
        id: target
        env:
          GH_TOKEN: ${{ secrets.ENTERPRISE_REPO_TOKEN }}
          EVENT: ${{ github.event_name }}
          INPUT_REF: ${{ github.event.inputs.ref }}
          INPUT_VERSION: ${{ github.event.inputs.version_tag }}
          PAYLOAD_REF: ${{ github.event.client_payload.ref }}
          PAYLOAD_SHA: ${{ github.event.client_payload.sha }}
          PAYLOAD_VERSION: ${{ github.event.client_payload.version }}
        run: |
          if [ "$EVENT" = schedule ]; then
            version=$(gh api repos/meteroid-oss/enterprise/releases/latest --jq .tag_name)
            sha=$(gh api "repos/meteroid-oss/enterprise/commits/$version" --jq .sha)
            ref=$sha
            tip=false
          else
            sha=$PAYLOAD_SHA
            version=${INPUT_VERSION:-$PAYLOAD_VERSION}
            ref=${INPUT_REF:-${PAYLOAD_SHA:-${PAYLOAD_REF:-main}}}
            if [ "$INPUT_REF" = main ] || [[ "$PAYLOAD_REF" == *main* ]] || [ -z "$INPUT_REF$PAYLOAD_REF" ]; then
              tip=true
            else
              tip=false
            fi
          fi
          {
            echo "ref=$ref"
            echo "version=$version"
            echo "short_sha=${sha:+sha-${sha:0:7}}"
            echo "tip=$tip"
          } >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check existing images
        id: check
        env:
          SHORT_SHA: ${{ steps.target.outputs.short_sha }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = schedule ]; then
            echo "Scheduled refresh; a full build is required."
            echo "exists=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "$SHORT_SHA" ]; then
            echo "No commit SHA provided; a full build is required."
            echo "exists=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          images=(meteroid-api-ee meteroid-scheduler-ee metering-api-ee meteroid-web-ee)
          platforms=(linux/amd64 linux/arm64)
          all_exist=true
          for img in "${images[@]}"; do
            ref="ghcr.io/meteroid-oss/${img}:${SHORT_SHA}"
            raw=$(docker buildx imagetools inspect --raw "$ref" 2>/dev/null) || {
              echo "❌ missing $ref"
              all_exist=false
              continue
            }
            for p in "${platforms[@]}"; do
              if jq -e --arg os "${p%/*}" --arg arch "${p#*/}" \
                '.manifests[]? | select(.platform.os==$os and .platform.architecture==$arch)' <<< "$raw" >/dev/null; then
                echo "✅ $ref ($p)"
              else
                echo "❌ $ref missing $p"
                all_exist=false
              fi
            done
          done

          if [ "$all_exist" = "true" ]; then
            echo "All images already exist for ${SHORT_SHA}; skipping build and retagging existing digests."
          fi
          echo "exists=$all_exist" >> "$GITHUB_OUTPUT"

  build:
    needs: check
    if: needs.check.outputs.exists != 'true'
    timeout-minutes: 75
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        platform:
          - linux/amd64
          - linux/arm64
        image_type:
          - name: meteroid-api-ee
            dockerfile: modules/meteroid/api.Dockerfile
          - name: meteroid-scheduler-ee
            dockerfile: modules/meteroid/scheduler.Dockerfile
          - name: metering-api-ee
            dockerfile: modules/metering/Dockerfile
          - name: meteroid-web-ee
            dockerfile: modules/web/web-app/Dockerfile
        include:
          - platform: linux/amd64
            mold_arch: x86_64
            proto_arch: x86_64
            grpc_health_probe_arch: amd64
            prefix: amd64
            runs_on: ubuntu-latest
          - platform: linux/arm64
            mold_arch: aarch64
            proto_arch: aarch_64
            grpc_health_probe_arch: arm64
            prefix: arm64
            runs_on: ubuntu-24.04-arm
    runs-on: ${{ matrix.runs_on }}
    steps:
      - name: Checkout enterprise repo
        uses: actions/checkout@v6
        with:
          repository: meteroid-oss/enterprise
          ref: ${{ needs.check.outputs.ref }}
          token: ${{ secrets.ENTERPRISE_REPO_TOKEN }}

      - name: Set up Cargo CI config
        run: |
          mkdir -p .cargo && ln -s ../.cargo-templates/ci.toml $_/config.toml

      - name: Prepare env
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_PASSWORD }}

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          file: ${{ matrix.image_type.dockerfile }}
          platforms: ${{ matrix.platform }}
          build-args: |
            MOLD_ARCH=${{ matrix.mold_arch }}
            PROTO_ARCH=${{ matrix.proto_arch }}
            GRPC_HEALTH_PROBE_ARCH=${{ matrix.grpc_health_probe_arch }}
            PROFILE=release
            CI=${{ env.CI }}
            "LICENSE_PUBLIC_KEY_PEM=${{ secrets.LICENSE_PUBLIC_KEY_PEM }}"
          push: true
          pull: true
          no-cache-filters: runtime
          cache-from: type=gha
          cache-to: type=gha,mode=max,ignore-error=true
          provenance: false
          outputs: type=image,name=ghcr.io/meteroid-oss/${{ matrix.image_type.name }},push-by-digest=true,name-canonical=true,push=true,store=true

      - name: Export digest
        run: |
          mkdir -p /tmp/digests/${{ matrix.image_type.name }}
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${{ matrix.image_type.name }}/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v5
        with:
          name: digests-${{ matrix.image_type.name }}-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/${{ matrix.image_type.name }}/*
          retention-days: 1

  manifest:
    needs: [check, build]
    if: always() && needs.check.result == 'success' && (needs.check.outputs.exists == 'true' || needs.build.result == 'success')
    strategy:
      matrix:
        image_type:
          - meteroid-api-ee
          - meteroid-scheduler-ee
          - metering-api-ee
          - meteroid-web-ee
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout scan policy
        uses: actions/checkout@v6
        with:
          sparse-checkout: .trivyignore
          sparse-checkout-cone-mode: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build path: assemble the manifest from freshly pushed digests.
      - name: Download digests
        if: needs.check.outputs.exists != 'true'
        uses: actions/download-artifact@v6
        with:
          path: /tmp/digests
          pattern: digests-${{ matrix.image_type }}-*
          merge-multiple: true

      - name: Resolve source refs (build)
        if: needs.check.outputs.exists != 'true'
        working-directory: /tmp/digests
        run: |
          echo "SOURCE_REFS=$(printf 'ghcr.io/meteroid-oss/${{ matrix.image_type }}@sha256:%s ' *)" >> "$GITHUB_ENV"

      # Reuse path: retag the existing per-SHA manifest.
      - name: Resolve source refs (reuse)
        if: needs.check.outputs.exists == 'true'
        run: |
          echo "SOURCE_REFS=ghcr.io/meteroid-oss/${{ matrix.image_type }}:${{ needs.check.outputs.short_sha }}" >> "$GITHUB_ENV"

      - name: Set up Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: ${{ env.TRIVY_VERSION }}

      # Runs before tagging: a fixable vulnerability at TRIVY_FAIL_SEVERITY blocks the release.
      - name: Scan images
        run: |
          for ref in $SOURCE_REFS; do
            {
              echo "### \`$ref\`"
              echo '```'
              trivy image --quiet --ignore-unfixed --severity HIGH,CRITICAL "$ref"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            trivy image --quiet --ignore-unfixed --severity "$TRIVY_FAIL_SEVERITY" --exit-code 1 "$ref"
          done

      - name: Docker meta
        id: meteroid-docker
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/meteroid-oss/${{ matrix.image_type }}
          tags: |
            type=raw,value=${{ needs.check.outputs.version }},enable=${{ needs.check.outputs.version != '' }}
            type=semver,pattern={{version}},value=${{ needs.check.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.check.outputs.version }}
            type=semver,pattern={{major}},value=${{ needs.check.outputs.version }}
            type=raw,value=${{ needs.check.outputs.short_sha }},enable=${{ needs.check.outputs.short_sha != '' }}

      - name: Create and push manifest list
        run: |
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $SOURCE_REFS

      - name: Push tip tag
        if: needs.check.outputs.tip == 'true'
        run: |
          docker buildx imagetools create \
            --tag ghcr.io/meteroid-oss/${{ matrix.image_type }}:tip \
            $SOURCE_REFS

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign image and attest SBOM
        env:
          IMAGE: ghcr.io/meteroid-oss/${{ matrix.image_type }}
          TIP: ${{ needs.check.outputs.tip }}
        run: |
          ref=$(jq -r '.tags[0] // empty' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          if [ -z "$ref" ] && [ "$TIP" = true ]; then ref="$IMAGE:tip"; fi
          [ -n "$ref" ] || { echo "No tag published; nothing to sign."; exit 0; }
          digest=$(docker buildx imagetools inspect "$ref" --format '{{.Manifest.Digest}}')
          trivy image --quiet --format cyclonedx --output sbom.cdx.json "$IMAGE@$digest"
          cosign sign --yes "$IMAGE@$digest"
          cosign attest --yes --type cyclonedx --predicate sbom.cdx.json "$IMAGE@$digest"
          echo "Signed $IMAGE@$digest" >> "$GITHUB_STEP_SUMMARY"
