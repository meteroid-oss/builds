name: Docker Build

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref to build (branch, tag, or SHA)'
        required: false
        default: 'main'
      version_tag:
        description: 'Version tag for the images (e.g., v1.0.0)'
        required: false
  repository_dispatch:
    types: [build]

concurrency:
  group: "${{ github.workflow }}-${{ github.event.inputs.ref || github.event.client_payload.ref || 'main' }}"
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  # Skip the build if all images already exist for this commit SHA.
  check:
    runs-on: ubuntu-latest
    outputs:
      exists: ${{ steps.check.outputs.exists }}
      short_sha: ${{ steps.sha.outputs.short_sha }}
    steps:
      - name: Compute short SHA
        id: sha
        env:
          FULL_SHA: ${{ github.event.client_payload.sha }}
        run: |
          if [ -n "$FULL_SHA" ]; then
            echo "short_sha=sha-${FULL_SHA:0:7}" >> "$GITHUB_OUTPUT"
          else
            echo "short_sha=" >> "$GITHUB_OUTPUT"
          fi

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check existing images
        id: check
        env:
          SHORT_SHA: ${{ steps.sha.outputs.short_sha }}
        run: |
          if [ -z "$SHORT_SHA" ]; then
            echo "No commit SHA provided; a full build is required."
            echo "exists=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          images=(meteroid-api meteroid-worker metering-api meteroid-web)
          platforms=(linux/amd64 linux/arm64)
          all_exist=true
          for img in "${images[@]}"; do
            ref="ghcr.io/meteroid-oss/${img}:${SHORT_SHA}"
            raw=$(docker buildx imagetools inspect --raw "$ref" 2>/dev/null) || {
              echo "❌ missing $ref"
              all_exist=false
              continue
            }
            for p in "${platforms[@]}"; do
              if jq -e --arg os "${p%/*}" --arg arch "${p#*/}" \
                '.manifests[]? | select(.platform.os==$os and .platform.architecture==$arch)' <<< "$raw" >/dev/null; then
                echo "✅ $ref ($p)"
              else
                echo "❌ $ref missing $p"
                all_exist=false
              fi
            done
          done

          if [ "$all_exist" = "true" ]; then
            echo "All images already exist for ${SHORT_SHA}; skipping build and retagging existing digests."
          fi
          echo "exists=$all_exist" >> "$GITHUB_OUTPUT"

  # The Rust binaries are compiled outside Docker, so the cargo cache survives dependency bumps
  # and each build reuses what the previous one compiled. Separate builds keep each binary's features.
  rust:
    needs: check
    if: needs.check.outputs.exists != 'true'
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            mold_arch: x86_64
            proto_arch: x86_64
            runs_on: ${{ vars.RUST_RUNNER_AMD64 || 'ubuntu-24.04' }}
          - arch: arm64
            mold_arch: aarch64
            proto_arch: aarch_64
            runs_on: ${{ vars.RUST_RUNNER_ARM64 || 'ubuntu-24.04-arm' }}
    runs-on: ${{ matrix.runs_on }}
    # The image the Dockerfiles build in, so the binaries link the same glibc and libraries.
    container:
      image: rust:1.96-bookworm
      credentials:
        username: ${{ secrets.DOCKER_HUB_USERNAME }}
        password: ${{ secrets.DOCKER_HUB_PASSWORD }}
    env:
      MOLD_VERSION: 1.11.0
      PROTO_VERSION: 21.8
    steps:
      - name: Checkout enterprise repo
        id: checkout
        uses: actions/checkout@v6
        with:
          repository: meteroid-oss/enterprise
          ref: ${{ github.event.inputs.ref || github.event.client_payload.sha || github.event.client_payload.ref || 'main' }}
          token: ${{ secrets.ENTERPRISE_REPO_TOKEN }}

      - name: Install build tools
        run: |
          apt-get update && apt-get -y install --no-install-recommends clang unzip
          curl -sSfL "https://github.com/rui314/mold/releases/download/v${MOLD_VERSION}/mold-${MOLD_VERSION}-${{ matrix.mold_arch }}-linux.tar.gz" \
            | tar -xz -C /usr/local --strip-components=1
          curl -sSfLo /tmp/protoc.zip "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTO_VERSION}/protoc-${PROTO_VERSION}-linux-${{ matrix.proto_arch }}.zip"
          unzip -q /tmp/protoc.zip -d /usr/local bin/protoc 'include/*'

      - name: Set up Cargo CI config
        run: |
          mkdir -p .cargo && ln -s ../.cargo-templates/ci.toml $_/config.toml

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ee
          shared-key: release-${{ matrix.arch }}

      - name: Build
        working-directory: ee
        env:
          LICENSE_PUBLIC_KEY_PEM: ${{ secrets.LICENSE_PUBLIC_KEY_PEM }}
          METEROID_VERSION: ${{ github.event.inputs.version_tag || github.event.client_payload.version || needs.check.outputs.short_sha }}
          GIT_SHA: ${{ steps.checkout.outputs.commit }}
        run: |
          if [ -n "$LICENSE_PUBLIC_KEY_PEM" ]; then
            echo "$LICENSE_PUBLIC_KEY_PEM" > crates/enterprise-license/keys/public.pem
          fi
          cargo build --locked --profile release -p meteroid-enterprise-api --bin meteroid-api --bin meteroid-svix-import
          cargo build --locked --profile release -p meteroid-enterprise-workers --bin meteroid-worker
          cargo build --locked --profile release -p meteroid-enterprise-metering --bin metering-api

      # Laid out as the Dockerfiles' builder stage, which the image job replaces with it.
      - name: Stage binaries
        run: |
          mkdir -p out/opt/src/target/release
          for bin in meteroid-api meteroid-svix-import meteroid-worker metering-api; do
            cp "ee/target/release/$bin" out/opt/src/target/release/
          done
          tar -C out -cf bins.tar .

      - uses: actions/upload-artifact@v5
        with:
          name: bins-${{ matrix.arch }}
          path: bins.tar
          retention-days: 1

  image:
    needs: [check, rust]
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
        image_type:
          - name: meteroid-api
            dockerfile: modules/meteroid/api.Dockerfile
          - name: meteroid-worker
            dockerfile: modules/meteroid/worker.Dockerfile
          - name: metering-api
            dockerfile: modules/metering/Dockerfile
        include:
          - arch: amd64
            runs_on: ubuntu-latest
          - arch: arm64
            runs_on: ubuntu-24.04-arm
    runs-on: ${{ matrix.runs_on }}
    steps:
      - name: Checkout enterprise repo
        uses: actions/checkout@v6
        with:
          repository: meteroid-oss/enterprise
          ref: ${{ github.event.inputs.ref || github.event.client_payload.sha || github.event.client_payload.ref || 'main' }}
          token: ${{ secrets.ENTERPRISE_REPO_TOKEN }}

      - uses: actions/download-artifact@v6
        with:
          name: bins-${{ matrix.arch }}

      - name: Stage the builder context
        run: |
          mkdir -p /tmp/builder/bin && tar -C /tmp/builder -xf bins.tar && rm bins.tar
          curl -sSfLo /tmp/builder/bin/grpc_health_probe \
            "https://github.com/grpc-ecosystem/grpc-health-probe/releases/download/v0.4.61/grpc_health_probe-linux-${{ matrix.arch }}"
          chmod +x /tmp/builder/bin/grpc_health_probe

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_PASSWORD }}

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          file: ${{ matrix.image_type.dockerfile }}
          build-contexts: builder=/tmp/builder
          platforms: linux/${{ matrix.arch }}
          build-args: PROFILE=release
          provenance: false
          outputs: type=image,name=ghcr.io/meteroid-oss/${{ matrix.image_type.name }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          mkdir -p /tmp/digests/${{ matrix.image_type.name }}
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${{ matrix.image_type.name }}/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v5
        with:
          name: digests-${{ matrix.image_type.name }}-linux-${{ matrix.arch }}
          path: /tmp/digests/${{ matrix.image_type.name }}/*
          retention-days: 1

  web:
    needs: check
    if: needs.check.outputs.exists != 'true'
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runs_on: ubuntu-latest
          - arch: arm64
            runs_on: ubuntu-24.04-arm
    runs-on: ${{ matrix.runs_on }}
    steps:
      - name: Checkout enterprise repo
        uses: actions/checkout@v6
        with:
          repository: meteroid-oss/enterprise
          ref: ${{ github.event.inputs.ref || github.event.client_payload.sha || github.event.client_payload.ref || 'main' }}
          token: ${{ secrets.ENTERPRISE_REPO_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_PASSWORD }}

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # One cache scope per platform: a shared one is overwritten by whichever job saves last.
      - name: Build and push
        uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          file: modules/web/web-app/Dockerfile
          platforms: linux/${{ matrix.arch }}
          push: true
          cache-from: type=gha,scope=web-${{ matrix.arch }}
          cache-to: type=gha,scope=web-${{ matrix.arch }},mode=max,ignore-error=true
          provenance: false
          outputs: type=image,name=ghcr.io/meteroid-oss/meteroid-web,push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          mkdir -p /tmp/digests/meteroid-web
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/meteroid-web/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v5
        with:
          name: digests-meteroid-web-linux-${{ matrix.arch }}
          path: /tmp/digests/meteroid-web/*
          retention-days: 1

  manifest:
    needs: [check, image, web]
    if: >-
      always() && needs.check.result == 'success' &&
      (needs.check.outputs.exists == 'true' || (needs.image.result == 'success' && needs.web.result == 'success'))
    # Each image is also published under its former name through 2.0. The worker keeps the
    # plain name it had as the scheduler, which the old compose file and chart pull.
    strategy:
      matrix:
        image_type:
          - name: meteroid-api
            former: meteroid-api-ee
          - name: meteroid-worker
            former: meteroid-scheduler-ee
            alias: meteroid-scheduler
          - name: metering-api
            former: metering-api-ee
          - name: meteroid-web
            former: meteroid-web-ee
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ github.event.inputs.version_tag || github.event.client_payload.version }}
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build path: assemble the manifest from freshly pushed digests.
      - name: Download digests
        if: needs.check.outputs.exists != 'true'
        uses: actions/download-artifact@v6
        with:
          path: /tmp/digests
          pattern: digests-${{ matrix.image_type.name }}-*
          merge-multiple: true

      - name: Resolve source refs (build)
        if: needs.check.outputs.exists != 'true'
        working-directory: /tmp/digests
        run: |
          echo "SOURCE_REFS=$(printf 'ghcr.io/meteroid-oss/${{ matrix.image_type.name }}@sha256:%s ' *)" >> "$GITHUB_ENV"

      # Reuse path: retag the existing per-SHA manifest.
      - name: Resolve source refs (reuse)
        if: needs.check.outputs.exists == 'true'
        run: |
          echo "SOURCE_REFS=ghcr.io/meteroid-oss/${{ matrix.image_type.name }}:${{ needs.check.outputs.short_sha }}" >> "$GITHUB_ENV"

      # The plain names held the AGPL images up to 1.0.0-rc7 (`latest` = 0.19.0): their semver
      # tags and `latest` start with 2.0.0.
      - name: Versions on the plain names
        id: plain
        run: |
          major=$(sed -E 's/^v?([0-9]+)\..*/\1/' <<< "$VERSION")
          if [[ "$major" =~ ^[0-9]+$ ]] && [ "$major" -ge 2 ]; then echo "semver=true"; else echo "semver=false"; fi >> "$GITHUB_OUTPUT"

      - name: Docker meta (plain name)
        id: plain-meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/meteroid-oss/${{ matrix.image_type.name }}
            ${{ matrix.image_type.alias && format('ghcr.io/meteroid-oss/{0}', matrix.image_type.alias) || '' }}
          flavor: |
            latest=${{ steps.plain.outputs.semver == 'true' && 'auto' || 'false' }}
          tags: |
            type=raw,value=${{ env.VERSION }},enable=${{ env.VERSION != '' }}
            type=semver,pattern={{version}},value=${{ env.VERSION }},enable=${{ steps.plain.outputs.semver == 'true' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.VERSION }},enable=${{ steps.plain.outputs.semver == 'true' }}
            type=semver,pattern={{major}},value=${{ env.VERSION }},enable=${{ steps.plain.outputs.semver == 'true' }}
            type=raw,value=${{ needs.check.outputs.short_sha }},enable=${{ needs.check.outputs.short_sha != '' }}

      - name: Docker meta (former name)
        id: meteroid-docker
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/meteroid-oss/${{ matrix.image_type.former }}
          tags: |
            type=raw,value=${{ github.event.inputs.version_tag }},enable=${{ github.event.inputs.version_tag != '' }}
            type=raw,value=${{ github.event.client_payload.version }},enable=${{ github.event.client_payload.version != '' }}
            type=semver,pattern={{version}},value=${{ github.event.inputs.version_tag || github.event.client_payload.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ github.event.inputs.version_tag || github.event.client_payload.version }}
            type=semver,pattern={{major}},value=${{ github.event.inputs.version_tag || github.event.client_payload.version }}
            type=raw,value=${{ needs.check.outputs.short_sha }},enable=${{ needs.check.outputs.short_sha != '' }}

      - name: Create and push manifest list
        env:
          PLAIN_JSON: ${{ steps.plain-meta.outputs.json }}
          FORMER_JSON: ${{ steps.meteroid-docker.outputs.json }}
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$PLAIN_JSON") \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$FORMER_JSON") \
            $SOURCE_REFS

      - name: Push tip tag
        if: github.event.inputs.ref == 'main' || contains(github.event.client_payload.ref, 'main') || (github.event.inputs.ref == '' && github.event.client_payload.ref == '')
        run: |
          docker buildx imagetools create \
            --tag ghcr.io/meteroid-oss/${{ matrix.image_type.name }}:tip \
            --tag ghcr.io/meteroid-oss/${{ matrix.image_type.former }}:tip \
            ${{ matrix.image_type.alias && format('--tag ghcr.io/meteroid-oss/{0}:tip', matrix.image_type.alias) || '' }} \
            $SOURCE_REFS

  chart:
    needs: [check, manifest]
    # Releases publish X.Y.Z; main builds publish 0.0.0-sha-xxxxxxx for staging.
    if: >-
      always() && needs.manifest.result == 'success' &&
      ((github.event.inputs.version_tag || github.event.client_payload.version) != '' ||
       (needs.check.outputs.short_sha != '' && github.event.client_payload.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      environment: ${{ steps.version.outputs.environment }}
    env:
      TAG: ${{ github.event.inputs.version_tag || github.event.client_payload.version }}
      SHORT_SHA: ${{ needs.check.outputs.short_sha }}
    steps:
      - name: Resolve the chart version
        id: version
        run: |
          if [ -n "$TAG" ]; then
            { echo "version=${TAG#v}"; echo "app_version=$TAG"; echo "environment=production"; } >> "$GITHUB_OUTPUT"
          else
            { echo "version=0.0.0-$SHORT_SHA"; echo "app_version=$SHORT_SHA"; echo "environment=staging"; } >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout enterprise repo
        uses: actions/checkout@v6
        with:
          repository: meteroid-oss/enterprise
          ref: ${{ github.event.inputs.ref || github.event.client_payload.sha || github.event.client_payload.ref || 'main' }}
          token: ${{ secrets.ENTERPRISE_REPO_TOKEN }}

      - uses: azure/setup-helm@v4
        with:
          version: v3.16.4

      - name: Package and push chart
        env:
          VERSION: ${{ steps.version.outputs.version }}
          APP_VERSION: ${{ steps.version.outputs.app_version }}
        run: |
          helm package k8s/meteroid --version "$VERSION" --app-version "$APP_VERSION"
          helm registry login ghcr.io -u ${{ github.repository_owner }} --password-stdin <<< "${{ secrets.GITHUB_TOKEN }}"
          helm push "meteroid-$VERSION.tgz" oci://ghcr.io/meteroid-oss/charts

  # Pins the published chart in infra, which Argo deploys. Holds the only infra credential, so
  # it runs no third-party action, and only in the infra-deploy environment.
  deploy:
    needs: chart
    if: always() && needs.chart.result == 'success'
    runs-on: ubuntu-latest
    environment: infra-deploy
    concurrency:
      group: infra-deploy
      cancel-in-progress: false
    env:
      VERSION: ${{ needs.chart.outputs.version }}
      TARGET: ${{ needs.chart.outputs.environment }}
    steps:
      - name: Pin the chart version in infra
        env:
          INFRA_DEPLOY_KEY: ${{ secrets.INFRA_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$INFRA_DEPLOY_KEY" > ~/.ssh/infra && chmod 600 ~/.ssh/infra
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
          export GIT_SSH_COMMAND="ssh -i $HOME/.ssh/infra -o IdentitiesOnly=yes"
          git clone -q --depth 1 git@github.com:meteroid-oss/infra.git infra && cd infra

          file="clusters/$TARGET/applications/meteroid.yaml"
          query='.spec.sources[]? | select(.chart == "meteroid")'
          if ! yq -e "$query" "$file" > /dev/null; then
            echo "$TARGET does not deploy the OCI chart yet, nothing to pin"
            exit 0
          fi
          yq -i "($query).targetRevision = strenv(VERSION)" "$file"
          if git diff --quiet; then
            echo "$TARGET already runs $VERSION"
            exit 0
          fi

          git -c user.name="meteroid-builds" -c user.email="noreply@meteroid.com" \
            commit -qam "build: deploy meteroid $VERSION to $TARGET"
          for i in 1 2 3 4; do
            git push -q origin HEAD:main && exit 0
            sleep $((2 ** i))
            git pull -q --rebase origin main
          done
          exit 1
